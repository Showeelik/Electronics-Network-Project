version = "0.1.0"
description = "Electronics sales network management system"
authors = [
    {name = "Showeelik",email = "zee******@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=5.1.6,<6.0.0)",
    "djangorestframework (>=3.15.2,<4.0.0)",
